services:
  db:
    image: postgis/postgis:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nbs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nbs} -d ${POSTGRES_DB:-nbs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nbs

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nbs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nbs}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nbs

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - nbs

networks:
  nbs:

volumes:
  postgres_data:
