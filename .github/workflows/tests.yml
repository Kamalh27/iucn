name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (unit + integration + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov bandit pip-audit

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --junitxml=report.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/report.xml
            backend/coverage.xml

      - name: Bandit static security scan
        working-directory: backend
        run: python -m bandit -r app -q -c pyproject.toml -f json -o bandit-report.json

      - name: pip-audit dependency scan
        working-directory: backend
        run: python -m pip_audit -f json -o pip-audit-report.json

      - name: Upload backend security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-report
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json

  frontend:
    name: Frontend (unit + component + e2e + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit + component tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm run test:security
